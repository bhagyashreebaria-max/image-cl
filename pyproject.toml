[project]
name = "papertrail-pdf"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pymupdf>=1.24,<2", "pikepdf>=9,<11", "pyHanko>=0.25,<0.33",
  "Pillow>=10,<13", "python-pptx>=1,<2", "python-multipart>=0.0.9,<1"
]

[tool.vercel]
entrypoint = "index:app"
